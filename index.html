<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="すだれ算で最大公約数と最小公倍数を練習できる、小学生向けの算数学習アプリ。">
<meta name="theme-color" content="#f7f7f2">
<title>すだれ算ラボ | 最大公約数・最小公倍数</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f7f7f2;
    --surface: #fff;
    --ink: #202839;
    --muted: #51596b;
    --line: #e2e4df;
    --purple: #533ca4;
    --purple-deep: #412c89;
    --lilac: #f0ebfd;
    --green: #116653;
    --mint: #e8f5ee;
    --honey: #fff6dc;
    --amber: #75500b;
    --red: #a12b46;
    --shadow: 0 2px 0 #24203508, 0 8px 24px #24203505;
    font-family: "Inter", "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif;
    font-weight: 500;
    line-height: 1.55;
    background: var(--paper);
    color: var(--ink);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; }
  button, select { cursor: pointer; }
  button:disabled { cursor: default; }
  button, a, input, select, summary { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid #765ed2; outline-offset: 3px; }
  h1, h2, h3, p { margin: 0; }
  button { color: inherit; }
  .wrap { width: min(1120px, calc(100% - 48px)); margin-inline: auto; }
  .site-header { background: var(--surface); border-bottom: 1px solid var(--line); }
  .header-inner { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; white-space: nowrap; }
  .brand-mark { position: relative; width: 36px; height: 36px; border-radius: 12px; background: var(--purple); }
  .brand-mark::before { content: ""; position: absolute; inset: 9px 8px 10px 12px; border: solid #fff; border-width: 0 0 2px 2px; border-radius: 0 0 0 5px; }
  .brand-mark::after { content: ""; position: absolute; top: 11px; right: 9px; width: 4px; height: 4px; border-radius: 50%; background: #d4ef97; box-shadow: -10px 0 #d4ef97, 0 13px #fff; }
  .header-actions { display: flex; align-items: center; gap: 12px; }
  .modes { display: flex; gap: 3px; padding: 4px; border: 1px solid #e8e5ee; background: #f5f3f8; border-radius: 14px; }
  .mode { border: 0; min-height: 40px; padding: 6px 18px; background: transparent; border-radius: 10px; font-size: .89rem; font-weight: 800; color: var(--muted); white-space: nowrap; }
  .mode[aria-pressed="true"] { background: var(--purple); color: white; }
  .mode[aria-pressed="false"]:hover { background: #ebe5f7; color: var(--purple-deep); }
  .button { min-height: 46px; display: inline-flex; justify-content: center; align-items: center; gap: .42em; border: 1px solid transparent; border-radius: 12px; padding: 8px 15px; font-size: .9rem; font-weight: 800; line-height: 1.4; text-align: center; }
  .button.primary { background: var(--purple); color: white; }
  .button.primary:hover:not(:disabled) { background: var(--purple-deep); }
  .button.outline { background: white; border-color: #d8d1eb; color: var(--purple-deep); }
  .button.outline:hover:not(:disabled) { background: var(--lilac); }
  .button.quiet { background: transparent; color: var(--purple-deep); }
  .button.quiet:hover:not(:disabled) { background: var(--lilac); }
  .button:disabled { background: #eeedf2; border-color: #eeedf2; color: #646473; }
  .button[aria-disabled="true"] { color: #655d80; }
  main { padding: 25px 0 42px; }
  .hero { position: relative; isolation: isolate; min-height: 184px; display: flex; align-items: center; overflow: hidden; padding: 26px 34px; border-radius: 24px; border: 1px solid #d9e9db; background: #eaf5e9; }
  .hero h1 { font-size: clamp(1.8rem, 4.2vw, 2.7rem); line-height: 1.3; letter-spacing: -.035em; font-weight: 900; }
  .hero h1 rt { font-size: .3em; font-weight: 700; letter-spacing: .025em; color: #365e50; }
  .hero p { margin-top: 10px; color: #315648; font-size: 1rem; font-weight: 700; }
  .hero-copy { position: relative; z-index: 1; }
  .hero-art { position: absolute; inset: 0 0 0 auto; width: 34%; overflow: hidden; pointer-events: none; }
  .hero-art::before { content: ""; position: absolute; inset: 15px -30px -80px 33px; border-radius: 50% 0 0 0; background: radial-gradient(#97b8a5 1px, transparent 1px) 0 0 / 13px 13px; opacity: .6; }
  .hero-art::after { content: ""; position: absolute; right: 33px; bottom: 28px; width: 57px; height: 57px; border-radius: 50%; background: #d5ec9d; }
  .sample-paper { position: absolute; z-index: 1; top: 25px; right: 82px; width: 199px; padding: 20px 18px 14px; transform: rotate(-9deg); border-radius: 14px; border: 1px solid #cbdcce; box-shadow: 7px 7px 0 #c5decf; background: #fffefa; color: var(--ink); font-size: 24px; font-weight: 850; font-variant-numeric: tabular-nums; }
  .sample-paper::before { content: ""; position: absolute; width: 68px; height: 18px; top: -8px; left: 66px; background: #ded4fa; transform: rotate(4deg); border-radius: 2px; }
  .sample-line { display: grid; grid-template-columns: 32px 1fr 1fr; text-align: center; line-height: 1.45; }
  .sample-divisor { color: var(--purple); border-right: 2px solid var(--ink); border-radius: 0 0 75% 0; }
  .sample-operand { border-bottom: 2px solid var(--ink); }
  .sample-last { color: var(--green); }
  .activity-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; min-height: 48px; gap: 10px; margin: 14px 0 10px; }
  .activity-title { font-size: 1.07rem; font-weight: 850; display: flex; align-items: center; gap: 10px; }
  .activity-title::before { content: ""; width: 5px; height: 17px; border-radius: 4px; background: var(--purple); }
  .activity-controls { display: flex; gap: 14px; align-items: center; margin-left: auto; }
  .level-control { display: flex; gap: 9px; align-items: center; color: var(--muted); font-size: .85rem; font-weight: 750; }
  select { min-height: 44px; border: 1px solid #dcdde0; border-radius: 10px; background: var(--surface); color: var(--ink); padding: 4px 11px; font-weight: 750; }
  .test-progress { display: flex; align-items: center; gap: 6px; font-size: .86rem; font-weight: 800; }
  .progress-dots { display: flex; gap: 5px; }
  .progress-dots span { width: 12px; height: 8px; border-radius: 6px; background: #dedbe7; }
  .progress-dots .current { background: #8e76d7; }
  .progress-dots .done { background: var(--purple-deep); }
  .workspace { display: grid; grid-template-columns: minmax(0, 1.48fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .side { display: grid; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 21px; box-shadow: var(--shadow); padding: 22px; }
  .card-heading { font-size: 1.1rem; font-weight: 850; }
  .problem-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .question-tag { font-size: .83rem; color: var(--purple-deep); font-weight: 800; background: var(--lilac); border-radius: 99px; padding: 4px 11px; white-space: nowrap; }
  .problem-line { display: flex; align-items: baseline; justify-content: center; gap: 15px; margin: 8px 0 1px; font-weight: 800; }
  .problem-line b { font-size: 2.62rem; line-height: 1.22; font-weight: 900; font-variant-numeric: tabular-nums; }
  .problem-line span { color: var(--muted); font-size: .95rem; }
  .problem-line.many { gap: clamp(4px, 1.25vw, 15px); }
  .problem-line.many b { font-size: clamp(1.55rem, 5.4vw, 2.62rem); }
  .instruction { color: var(--muted); text-align: center; font-size: .88rem; margin: 4px 0 13px; }
  .phase-label { display: inline-block; margin-right: .35em; font-weight: 850; color: var(--purple-deep); }
  .phase-label.multiple { color: var(--amber); }
  .board { padding: 18px 18px 14px; min-height: 143px; display: grid; align-items: center; border-radius: 15px; border: 1px solid #e4def1; background-color: #faf8ff; background-image: linear-gradient(#ede8f6 1px, transparent 1px), linear-gradient(90deg, #ede8f6 1px, transparent 1px); background-size: 18px 18px; }
  .ladder { width: min(100%, 370px); margin: auto; }
  .ladder-row { display: grid; grid-template-columns: minmax(52px, .72fr) repeat(var(--column-count), minmax(0, 1fr)); align-items: stretch; text-align: center; }
  .row-divisor, .row-number { display: flex; align-items: center; justify-content: center; min-height: 59px; font-size: 1.9rem; font-weight: 850; font-variant-numeric: tabular-nums; line-height: 1; }
  .row-divisor { color: var(--purple-deep); padding-right: 13px; position: relative; }
  .divide .row-divisor::after { content: ""; position: absolute; right: -2px; top: 7px; bottom: 0; width: 17px; border-right: 2px solid #34314a; border-radius: 0 0 100% 0; pointer-events: none; }
  .divide .row-number { border-bottom: 2px solid #34314a; }
  .divide .row-number:nth-child(2) { position: relative; }
  .divide .row-number:nth-child(2)::before { content: ""; position: absolute; left: -14px; bottom: -2px; height: 2px; width: 15px; background: #34314a; }
  .factor, .remainder { min-width: 42px; padding: 5px 8px; border-radius: 9px; }
  .factor { background: var(--lilac); }
  .factor.extra { background: #fceac0; color: var(--amber); }
  .remainder { color: var(--green); background: #dff1e7; }
  .carry { color: var(--muted); }
  .carry-arrow { font-size: .64rem; margin-left: .13em; }
  .divisor-input { width: 64px; max-width: 100%; height: 49px; border: 2px solid #a58edf; background: white; color: var(--purple-deep); border-radius: 10px; padding: 3px; text-align: center; font-size: 1.45rem; font-weight: 850; }
  .divisor-input::placeholder { color: #776692; opacity: 1; }
  .number-input[aria-invalid="true"], .divisor-input[aria-invalid="true"] { border-color: var(--red); }
  .board-key { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; margin-top: 12px; color: var(--purple-deep); font-size: .78rem; font-weight: 800; }
  .board-key .extra-key, .formula .extra { color: var(--amber); }
  .board-key .last-key { color: var(--green); }
  .board-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 13px; }
  .board-actions .button { flex: 1 1 auto; }
  .board-actions .undo { flex: 0 1 auto; padding-inline: 11px; }
  .feedback { font-size: .84rem; color: var(--muted); }
  .feedback:not(:empty) { margin-top: 10px; }
  .feedback[data-kind="bad"] { color: var(--red); font-weight: 700; }
  .feedback[data-kind="good"] { color: var(--green); font-weight: 750; }
  .answer-card .card-heading { margin-bottom: 4px; }
  .answer-help { color: var(--muted); font-size: .83rem; min-height: 1.35em; }
  .answer-form { display: grid; gap: 8px; margin-top: 11px; }
  .answer-row { display: grid; gap: 5px 9px; align-items: center; grid-template-columns: minmax(0, 1fr) 78px; border-radius: 12px; padding: 10px 11px; }
  .answer-row.gcd { background: var(--lilac); color: var(--purple-deep); }
  .answer-row.lcm { background: var(--mint); color: var(--green); }
  .answer-row label { font-weight: 850; display: block; }
  .formula { display: block; font-size: .76rem; overflow-wrap: anywhere; }
  .formula .left { color: var(--purple-deep); font-weight: 850; }
  .formula .last { color: var(--green); font-weight: 850; }
  .number-input { min-width: 0; width: 100%; height: 45px; text-align: center; border: 1.5px solid #b6abd5; border-radius: 9px; background: white; color: var(--ink); font-weight: 800; font-size: 1.15rem; }
  .number-input:disabled { background: #ffffffb3; border-color: #d0ced8; }
  .number-input::placeholder { color: #716982; opacity: 1; }
  .lcm .number-input { border-color: #94bbae; }
  .number-input[aria-invalid="true"] { border-color: var(--red); }
  .number-input[data-correct="true"] { border-color: var(--green); }
  .answer-mark { grid-column: 1 / -1; font-size: .78rem; font-weight: 800; }
  .answer-mark[data-kind="bad"] { color: var(--red); }
  .answer-mark[data-kind="good"] { color: var(--green); }
  .answer-form > .button { width: 100%; margin-top: 3px; }
  .answer-form .feedback:not(:empty) { margin-top: 1px; }
  .answer-form .review-status { font-size: 1rem; font-weight: 850; }
  .hint-card { padding: 14px 16px; border-radius: 17px; background: var(--honey); border: 1px solid #ede1ba; }
  .hint-card .card-heading { font-size: .98rem; display: flex; align-items: center; gap: 8px; }
  .hint-icon { color: #805300; background: #fae6a6; border-radius: 50%; display: inline-grid; place-items: center; width: 25px; height: 25px; font-size: .88rem; }
  .hint-text { color: #64471e; font-size: .86rem; }
  .hint-text:not(:empty) { margin-top: 8px; }
  .hint-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
  .hint-actions .button { min-height: 44px; padding: 5px 9px; }
  .hint-actions .button:hover { background: #fae9b1; }
  .tail-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 13px; }
  .result-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .result-title { font-size: 1.5rem; font-weight: 900; }
  .score { margin: 11px 0 4px; color: var(--purple-deep); font-weight: 850; }
  .score strong { font-size: 2.3rem; }
  .result-list { margin: 18px 0; display: grid; gap: 8px; }
  .result-list details { border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
  .result-list summary { min-height: 48px; padding: 12px 2px; cursor: pointer; font-weight: 800; }
  .result-list summary span { display: inline-block; margin-left: 8px; }
  .summary-mark { color: var(--purple-deep); }
  .worked { margin: 0 0 12px; }
  .worked p { margin: 8px 0 0; font-size: .87rem; overflow-wrap: anywhere; }
  .worked .board { margin-top: 9px; }
  .worked .gcd-text { color: var(--purple-deep); }
  .worked .lcm-text { color: var(--green); }
  .group-question { padding: clamp(20px, 4vw, 45px); text-align: center; background: var(--mint); border-color: #d5e7dc; }
  .group-question .question-tag { display: inline-block; }
  .group-question .problem-line { margin: 10px 0 9px; gap: clamp(7px, 2vw, 23px); }
  .group-question .problem-line b { font-size: clamp(1.85rem, 8.5vw, 5rem); }
  .group-question .problem-line span { font-size: clamp(.9rem, 3vw, 1.6rem); }
  .group-prompt { font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 750; }
  .group-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .group-actions .button { min-width: 125px; }
  .group-reveal { margin-top: 14px; }
  .group-scores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin: 12px 0 17px; }
  .group-score { display: grid; padding: 10px; text-align: center; border-radius: 12px; font-size: clamp(.88rem, 3vw, 1.1rem); font-weight: 850; }
  .group-score strong { font-size: clamp(1.65rem, 5.6vw, 3rem); line-height: 1.2; }
  .group-score.gcd { background: var(--lilac); color: var(--purple-deep); }
  .group-score.lcm { background: var(--mint); color: var(--green); }
  .group-worked { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; margin-top: 7px; align-items: start; }
  .group-worked .worked { margin-bottom: 0; }
  .group-worked .worked p { font-size: clamp(.95rem, 2vw, 1.1rem); }
  .worked-steps { font-size: clamp(.9rem, 2vw, 1.04rem); margin: 8px 0 0; padding-left: 1.5em; }
  .worked-steps li + li { margin-top: 8px; }
  dialog { width: min(460px, calc(100% - 28px)); max-height: calc(100% - 28px); padding: 22px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: 0 16px 60px #20152e38; }
  dialog::backdrop { background: #25203478; }
  .dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .dialog-head h2 { font-size: 1.25rem; font-weight: 900; }
  .dialog-lead { font-size: .92rem; color: var(--muted); margin-top: 8px; }
  .dialog-steps { margin: 11px 0 0; padding-inline-start: 1.4em; font-size: .88rem; }
  .dialog-steps li + li { margin-top: 3px; }
  @media (max-width: 850px) {
    .wrap { width: calc(100% - 36px); }
    .card { padding: 17px; }
    .workspace { gap: 12px; grid-template-columns: minmax(0, 1.28fr) minmax(0, 1fr); }
    .hero-art { width: 29%; }
    .sample-paper { right: 31px; top: 32px; transform: rotate(-9deg) scale(.82); transform-origin: top right; }
  }
  @media (max-width: 660px) {
    .wrap { width: calc(100% - 26px); }
    main { padding-top: 13px; }
    .header-inner { min-height: 62px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; padding-block: 7px; }
    .brand { font-size: 1rem; gap: 7px; }
    .brand-mark { width: 32px; height: 32px; border-radius: 10px; }
    .brand-mark::before { inset: 7px 7px 8px 10px; }
    .brand-mark::after { right: 8px; top: 9px; }
    .header-actions { display: contents; }
    .header-actions .modes { grid-column: 1 / -1; grid-row: 2; }
    .header-actions .mode { flex: 1; }
    .header-actions .button { grid-column: 2; grid-row: 1; }
    .modes { gap: 1px; padding: 3px; }
    .mode { padding-inline: 8px; min-height: 44px; font-size: .78rem; }
    .header-actions .button { padding-inline: 7px; font-size: .78rem; }
    .hero { min-height: 132px; padding: 16px 17px; border-radius: 17px; }
    .hero h1 { font-size: clamp(1.35rem, 5.2vw, 1.95rem); }
    .hero p { margin-top: 6px; font-size: .8rem; }
    .hero-art { display: none; }
    .activity-bar { margin-top: 8px; margin-bottom: 9px; gap: 5px 10px; }
    .activity-controls { order: 1; display: grid; grid-template-columns: 1fr 1fr; width: 100%; gap: 10px; }
    .level-control { display: grid; gap: 3px; }
    .level-control select { width: 100%; min-width: 0; }
    .workspace { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
    .side { gap: 12px; }
    .hint-card { padding: 10px 13px; }
    .hint-actions .button { padding-inline: 7px; }
    .problem-line b { font-size: 2.28rem; }
    .board { padding: 11px 13px; min-height: 118px; }
    .row-number, .row-divisor { font-size: 1.6rem; }
    .factor, .remainder { min-width: 34px; padding-inline: 4px; }
    .board-actions { gap: 6px; }
    .board-actions .button { padding-inline: 9px; }
    .group-worked { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  }
  @media (max-width: 365px) {
    .header-inner { justify-content: center; }
    .hero h1 { font-size: 1.2rem; }
    .hero p { font-size: .75rem; }
    .row-divisor { padding-right: 10px; }
    .divisor-input { width: 50px; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>すだれ算ラボ</div>
    <div class="header-actions">
      <nav class="modes" aria-label="学習スタイル">
        <button class="mode" id="solo-mode" type="button" aria-pressed="true">一人で学習</button>
        <button class="mode" id="group-mode" type="button" aria-pressed="false">みんなで学習</button>
      </nav>
      <button class="button quiet" id="example" type="button">お手本</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="solo-hero" aria-labelledby="hero-title">
    <div class="hero-copy">
      <h1 id="hero-title"><ruby>最大公約数<rt>さいだいこうやくすう</rt></ruby>と<ruby>最小公倍数<rt>さいしょうこうばいすう</rt></ruby></h1>
      <p>同じ数でわって、すだれ算で答えを見つけよう。</p>
    </div>
    <div class="hero-art" aria-hidden="true">
      <div class="sample-paper">
        <div class="sample-line"><span class="sample-divisor">3</span><span class="sample-operand">9</span><span class="sample-operand">15</span></div>
        <div class="sample-line sample-last"><span></span><span>3</span><span>5</span></div>
      </div>
    </div>
  </section>

  <div class="activity-bar">
    <nav class="modes" id="solo-modes" aria-label="一人で学習のメニュー">
      <button class="mode" id="practice-mode" type="button" aria-pressed="true">れんしゅう</button>
      <button class="mode" id="test-mode" type="button" aria-pressed="false">テスト</button>
    </nav>
    <h1 class="activity-title" id="group-title" hidden>みんなで学習</h1>
    <div class="activity-controls">
      <label class="level-control">レベル
        <select id="level">
          <option value="2">1：2つの数</option>
          <option value="3">2：3つの数</option>
          <option value="4">3：4つの数</option>
        </select>
      </label>
      <label class="level-control">むずかしさ
        <select id="difficulty">
          <option value="basic">きほん</option>
          <option value="advanced">チャレンジ</option>
        </select>
      </label>
    </div>
    <div class="test-progress" id="test-progress" hidden></div>
  </div>

  <div id="game">
    <div class="workspace">
      <section class="card problem-card" aria-labelledby="problem-title">
        <div class="problem-header">
          <h2 class="card-heading" id="problem-title" tabindex="-1">すだれ算を書こう</h2>
          <span class="question-tag" id="question-tag"></span>
        </div>
        <p class="problem-line" id="problem-line"></p>
        <p class="instruction" id="board-instruction"></p>
        <form id="divide-form" novalidate>
          <div class="board" id="board"></div>
          <div class="board-actions">
            <button class="button primary" type="submit" id="divide">この数でわる</button>
            <button class="button outline" type="button" id="finish">もうわり切れない</button>
            <button class="button quiet undo" type="button" id="undo" hidden>↶ もどす</button>
          </div>
        </form>
        <p class="feedback" id="board-feedback" role="status" aria-atomic="true"></p>
      </section>

      <div class="side">
        <aside class="hint-card" id="hint-card" aria-labelledby="hint-title">
          <h2 class="card-heading" id="hint-title"><span class="hint-icon" aria-hidden="true">?</span>ヒント</h2>
          <p class="hint-text" id="hint-text" role="status" aria-atomic="true"></p>
          <div class="hint-actions">
            <button class="button quiet" id="hint" type="button" aria-controls="hint-text">ヒントを見る</button>
            <button class="button quiet" id="solution" type="button">解き方と答え</button>
          </div>
        </aside>

        <section class="card answer-card" aria-labelledby="answer-title">
          <h2 class="card-heading" id="answer-title" tabindex="-1">答えを入れよう</h2>
          <p class="answer-help" id="answer-help"></p>
          <form id="answer-form" class="answer-form" novalidate>
            <div class="answer-row gcd">
              <div><label for="gcd-answer">最大公約数</label><span class="formula" id="gcd-formula"></span></div>
              <input class="number-input" id="gcd-answer" type="text" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="—" aria-describedby="gcd-formula gcd-mark">
              <span class="answer-mark" id="gcd-mark" hidden></span>
            </div>
            <div class="answer-row lcm">
              <div><label for="lcm-answer">最小公倍数</label><span class="formula" id="lcm-formula"></span></div>
              <input class="number-input" id="lcm-answer" type="text" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="—" aria-describedby="lcm-formula lcm-mark">
              <span class="answer-mark" id="lcm-mark" hidden></span>
            </div>
            <p class="feedback" id="answer-feedback" role="status" aria-atomic="true"></p>
            <button class="button primary" id="submit-answers" type="submit">答え合わせ</button>
            <button class="button primary" id="test-next" type="button" hidden>次の問題へ</button>
          </form>
        </section>

      </div>
    </div>
    <div class="tail-actions">
      <button class="button quiet" id="skip" type="button" hidden>この問題をとばす</button>
      <button class="button outline" id="next" type="button">次の問題へ <span aria-hidden="true">→</span></button>
    </div>
  </div>

  <section class="card" id="results" aria-labelledby="result-title" hidden></section>

  <div id="group-game" hidden>
    <section class="card group-question" aria-labelledby="group-question-title">
      <h2 class="question-tag" id="group-question-title" tabindex="-1"></h2>
      <p class="problem-line" id="group-numbers"></p>
      <p class="group-prompt">最大公約数と最小公倍数を求めよう。</p>
      <div class="group-actions">
        <button class="button primary" id="group-check" type="button" aria-controls="group-reveal" aria-expanded="false">答え合わせ</button>
        <button class="button outline" id="group-next" type="button">次の問題へ <span aria-hidden="true">→</span></button>
      </div>
    </section>
    <section class="card group-reveal" id="group-reveal" aria-labelledby="group-reveal-title" hidden>
      <h2 class="card-heading" id="group-reveal-title" tabindex="-1">答えと解き方</h2>
      <div id="group-solution"></div>
    </section>
  </div>
</main>

<dialog id="worked-dialog" aria-labelledby="dialog-title">
  <div class="dialog-head">
    <h2 id="dialog-title"></h2>
    <form method="dialog"><button class="button quiet" type="submit" autofocus>とじる</button></form>
  </div>
  <div id="dialog-content"></div>
</dialog>

<script>
"use strict";

const byId = id => document.getElementById(id);
const examples = { 2: [12, 18], 3: [12, 18, 24], 4: [12, 18, 24, 30] };
const ranges = {
  2: { basic: [4, 36, Infinity], advanced: [12, 96, Infinity] },
  3: { basic: [3, 24, 180], advanced: [4, 48, 840] },
  4: { basic: [2, 20, 420], advanced: [3, 34, 1600] }
};
const testLength = 5;
const product = values => values.reduce((total, value) => total * value, 1);
const numberList = values => values.length === 2 ? values.join(" と ") : values.join("、");

function gcd(first, second) {
  while (second !== 0) {
    [first, second] = [second, first % second];
  }
  return first;
}

function leastFactor(number) {
  for (let divisor = 2; divisor * divisor <= number; divisor++) {
    if (number % divisor === 0) return divisor;
  }
  return number;
}

function commonDivisor(numbers) {
  const common = numbers.reduce(gcd);
  return common === 1 ? null : leastFactor(common);
}

function divisionPhase(numbers) {
  return numbers.length > 2 && commonDivisor(numbers) === null ? "multiple" : "common";
}

function partialDivisor(numbers) {
  let smallest = Infinity;
  for (let first = 0; first < numbers.length - 1; first++) {
    for (let second = first + 1; second < numbers.length; second++) {
      const common = gcd(numbers[first], numbers[second]);
      if (common > 1) smallest = Math.min(smallest, leastFactor(common));
    }
  }
  return Number.isFinite(smallest) ? smallest : null;
}

function expected(numbers) {
  const common = numbers.reduce(gcd);
  const multiple = numbers.reduce((total, number) => total / gcd(total, number) * number, 1);
  return [common, multiple];
}

function makePools(count, difficulty) {
  const [minimum, maximum, limit] = ranges[count][difficulty];
  const [, basicMaximum, basicLimit] = ranges[count].basic;
  const groups = { all: [], some: [], none: [] };
  function addSets(numbers, start) {
    if (numbers.length < count) {
      const upper = maximum - (count - numbers.length) + 1;
      for (let next = start; next <= upper; next++) addSets([...numbers, next], next + 1);
      return;
    }
    const [common, multiple] = expected(numbers);
    if (multiple > limit) return;
    if (count > 2 && difficulty === "advanced" && numbers.at(-1) <= basicMaximum && multiple <= basicLimit) return;
    const group = common > 1 ? "all" : partialDivisor(numbers) !== null ? "some" : "none";
    groups[group].push(numbers);
  }
  addSets([], minimum);
  return groups;
}

function randomNumbers(groups, group, excluded) {
  const blocked = new Set(excluded.map(numbers => numbers.join(",")));
  const choices = groups[group].filter(numbers => !blocked.has(numbers.join(",")));
  return choices[Math.floor(Math.random() * choices.length)];
}

function problem(numbers) {
  return { numbers, steps: [], phase: divisionPhase(numbers), hint: 0, divisorDraft: "", answerDraft: ["", ""] };
}

const sessions = new Map();
let audience = "solo";
let mode = "practice";
let session;

function loadSettings() {
  const count = Number(byId("level").value);
  const difficulty = byId("difficulty").value;
  const key = count + ":" + difficulty;
  if (!sessions.has(key)) {
    const groups = makePools(count, difficulty);
    const first = difficulty === "basic" ? examples[count] : randomNumbers(groups, "all", []);
    sessions.set(key, { count, groups, practice: { number: 1, current: problem(first) }, test: null, group: null });
  }
  session = sessions.get(key);
  showQuestion();
}

function startTest() {
  const problems = [];
  const noSharedIndex = 1 + Math.floor(Math.random() * (testLength - 1));
  for (let index = 0; index < testLength; index++) {
    const group = index === noSharedIndex ? "none" : session.count > 2 && index % 2 === 1 ? "some" : "all";
    problems.push(randomNumbers(session.groups, group, [examples[session.count], ...problems]));
  }
  session.test = { problems, records: [], index: 0, current: problem(problems[0]) };
}

function currentProblem() {
  return mode === "practice" ? session.practice.current : session.test.current;
}

function remaining(item) {
  const last = item.steps.at(-1);
  return last ? last.after : item.numbers;
}

function nextDivisor(item) {
  const numbers = remaining(item);
  return item.phase === "multiple" ? partialDivisor(numbers) : commonDivisor(numbers);
}

function integer(text) {
  const normalized = text.normalize("NFKC").trim();
  const value = Number(normalized);
  return /^\d+$/.test(normalized) && Number.isSafeInteger(value) ? value : null;
}

function addStep(item, divisor) {
  const before = remaining(item);
  const after = before.map(number => number % divisor ? number : number / divisor);
  item.steps.push({ divisor, before, after, phase: item.phase });
  item.phase = divisionPhase(after);
  return after;
}

function workedProblem(numbers) {
  const item = problem(numbers);
  let divisor;
  while ((divisor = nextDivisor(item)) !== null) addStep(item, divisor);
  item.phase = "answer";
  return item;
}

function ladderRow(numbers, divisor, kind, phase) {
  let divisorContent = "";
  if (kind === "active") {
    divisorContent = '<input class="divisor-input" id="divisor" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="?" aria-label="わる数" aria-describedby="board-instruction board-feedback">';
  } else if (kind === "past") {
    const extra = phase === "multiple" ? " extra" : "";
    divisorContent = '<span class="factor' + extra + '">' + divisor + '</span>';
  }
  const numberCells = numbers.map(number => {
    if (kind === "past" && phase === "multiple" && number % divisor !== 0) {
      return '<span class="row-number carry" title="そのまま下へ">' + number + '<span class="carry-arrow" aria-label="そのまま下へ">↓</span></span>';
    }
    const content = kind === "last" ? '<span class="remainder">' + number + '</span>' : number;
    return '<span class="row-number">' + content + '</span>';
  }).join("");
  const division = kind === "last" ? "" : " divide";
  return '<div class="ladder-row' + division + '"><span class="row-divisor">' + divisorContent + '</span>' + numberCells + '</div>';
}

function ladder(item) {
  const rows = item.steps.map(step => ladderRow(step.before, step.divisor, "past", step.phase)).join("");
  const kind = item.phase === "answer" ? "last" : "active";
  return '<div class="ladder" style="--column-count:' + item.numbers.length + '">' + rows + ladderRow(remaining(item), null, kind, item.phase) + '</div>';
}

function factorGroups(item) {
  const common = item.steps.filter(step => step.phase === "common").map(step => step.divisor);
  const extra = item.steps.filter(step => step.phase === "multiple").map(step => step.divisor);
  return { common, extra, last: remaining(item) };
}

function boardKey(item) {
  const { common, extra } = factorGroups(item);
  const left = item.numbers.length === 2 ? "左の数" : "全部をわった数";
  return '<p class="board-key"><span>' + left + (common.length ? "" : "は 1 と考える") + '</span>' +
    (extra.length ? '<span class="extra-key">一部をわった数</span>' : "") +
    '<span class="last-key">最後に残った数</span></p>';
}

function displayBoard(review = null) {
  const current = currentProblem();
  const item = review?.skipped ? workedProblem(current.numbers) : current;
  const numbers = remaining(item);
  const finished = item.phase === "answer";
  const multiple = item.phase === "multiple";
  const several = numbers.length > 2;
  const isTest = mode === "test";
  const showFormula = !isTest || review;
  const key = finished && showFormula ? boardKey(item) : "";
  byId("board").innerHTML = ladder(item) + key;
  if (!finished) byId("divisor").value = item.divisorDraft;
  let instruction = numberList(numbers) + (several ? " を全部" : " を両方") + "わり切れる数を入れよう。";
  if (review) {
    instruction = "すだれ算と答えをたしかめよう。";
  } else if (finished) {
    instruction = "すだれ算ができたよ。次は答えを求めよう。";
  } else if (multiple) {
    instruction = '<span class="phase-label multiple">一部をわる</span> 全部をわり切れる数がないので、2、3、5 などの素数で2つ以上をわろう。わり切れない数はそのまま下へ。';
  } else if (several) {
    instruction = '<span class="phase-label">全部を同時にわる</span> ' + instruction;
  }
  byId("board-instruction").innerHTML = instruction;
  byId("divide").hidden = finished;
  byId("finish").hidden = finished || (several && !multiple);
  byId("finish").textContent = multiple ? "2つ以上をわる数はもうない" : "もうわり切れない";
  byId("undo").hidden = Boolean(review) || (item.steps.length === 0 && !finished);
  answerInputs.forEach(input => { input.disabled = !finished || Boolean(review); });
  byId("submit-answers").disabled = !finished || Boolean(review);
  let help = "すだれ算ができたら、ここに答えを入れよう。";
  if (review) {
    help = review.skipped ? "この問題はとばしたよ。" : "入力した答えと採点結果だよ。";
  } else if (finished) {
    help = isTest ? "2つの答えを入れて、答え合わせをしよう。" : "すだれ算の数をかけて、答えを出そう。";
  }
  byId("answer-help").textContent = help;

  if (finished && showFormula) {
    const { common, extra, last } = factorGroups(item);
    const leftPart = '<span class="left">' + (common.join(" × ") || "1") + '</span>';
    const extraPart = extra.length ? ' × <span class="extra">' + extra.join(" × ") + '</span>' : "";
    byId("gcd-formula").innerHTML = leftPart;
    byId("lcm-formula").innerHTML = leftPart + extraPart + ' × <span class="last">' + last.join(" × ") + '</span>';
  } else {
    byId("gcd-formula").textContent = isTest ? "" : several ? "全部を同時にわった数をかける" : "左の数をかける";
    byId("lcm-formula").textContent = isTest ? "" : "左の数すべてと、最後に残った数をかける";
  }
  displayHint();
}

function message(id, value = "", kind = "") {
  const node = byId(id);
  node.dataset.kind = kind;
  node.textContent = value;
}

const answerInputs = [byId("gcd-answer"), byId("lcm-answer")];
const answerMarks = [byId("gcd-mark"), byId("lcm-mark")];

function answerMark(index, value = "", kind = "") {
  const mark = answerMarks[index];
  mark.hidden = value === "";
  mark.textContent = value;
  mark.dataset.kind = kind;
  answerInputs[index].setAttribute("aria-invalid", String(kind === "bad"));
  answerInputs[index].dataset.correct = String(kind === "good");
}

function clearAnswers(values = ["", ""]) {
  answerInputs.forEach((input, index) => {
    input.value = values[index];
    answerMark(index);
  });
  message("answer-feedback");
}

function showQuestion(moveFocus = false) {
  const isGroup = audience === "group";
  const isTest = !isGroup && mode === "test";
  if (isTest && !session.test) startTest();
  const { practice, test } = session;
  const complete = isTest && test.index === testLength;
  const review = isTest ? test.records[test.index] : null;
  byId("solo-mode").setAttribute("aria-pressed", String(!isGroup));
  byId("group-mode").setAttribute("aria-pressed", String(isGroup));
  byId("practice-mode").setAttribute("aria-pressed", String(mode === "practice"));
  byId("test-mode").setAttribute("aria-pressed", String(mode === "test"));
  byId("solo-hero").hidden = isGroup;
  byId("solo-modes").hidden = isGroup;
  byId("example").hidden = isGroup || isTest;
  byId("group-title").hidden = !isGroup;
  byId("group-game").hidden = !isGroup;
  byId("test-progress").hidden = !isTest || complete;
  byId("game").hidden = isGroup || complete;
  byId("results").hidden = !complete;
  if (isGroup) {
    if (!session.group) nextGroup();
    else displayGroup();
    return;
  }
  if (complete) {
    displayResults(moveFocus);
    return;
  }

  const index = isTest ? test.index + 1 : practice.number;
  if (isTest) {
    const dots = Array.from({ length: testLength }, (_, step) => {
      const status = step < test.records.length ? "done" : step === test.index ? "current" : "";
      return '<span class="' + status + '"></span>';
    }).join("");
    byId("test-progress").innerHTML = '<span class="progress-dots" aria-hidden="true">' + dots + '</span><span>' + index + ' / ' + testLength + ' 問</span>';
  }
  byId("hint-card").hidden = isTest;
  byId("next").hidden = isTest;
  byId("skip").hidden = !isTest || Boolean(review);
  byId("submit-answers").hidden = Boolean(review);
  byId("test-next").hidden = !review;
  byId("answer-feedback").classList.toggle("review-status", Boolean(review));
  byId("answer-title").textContent = review ? "答え合わせ" : "答えを入れよう";
  byId("question-tag").textContent = "第 " + index + " 問";
  displayNumbers("problem-line", currentProblem().numbers);
  message("board-feedback");
  clearAnswers(review?.skipped ? ["", ""] : currentProblem().answerDraft);
  displayBoard(review);
  if (review) displayTestReview(review, index === testLength);
  if (moveFocus) byId("problem-title").focus();
}

function displayNumbers(id, numbers) {
  const line = byId(id);
  line.classList.toggle("many", numbers.length > 2);
  const separator = numbers.length === 2 ? "と" : "・";
  line.innerHTML = numbers.map(number => "<b>" + number + "</b>").join("<span>" + separator + "</span>");
}

function practiceGroup(count, number) {
  if (number % 4 === 0) return "none";
  return count > 2 && number % 4 === 2 ? "some" : "all";
}

function nextPractice() {
  const { count, groups, practice } = session;
  const nextNumber = practice.number + 1;
  const group = practiceGroup(count, nextNumber);
  const numbers = randomNumbers(groups, group, [practice.current.numbers]);
  practice.number = nextNumber;
  practice.current = problem(numbers);
  showQuestion(true);
}

function nextGroup(moveFocus = false) {
  const { count, groups, group } = session;
  const number = (group?.number ?? 0) + 1;
  const excluded = group ? [group.numbers] : [examples[count]];
  const numbers = randomNumbers(groups, practiceGroup(count, number), excluded);
  session.group = { number, numbers, revealed: false };
  displayGroup();
  if (moveFocus) byId("group-question-title").focus();
}

function displayGroup() {
  const { number, numbers, revealed } = session.group;
  byId("group-question-title").textContent = "第 " + number + " 問";
  displayNumbers("group-numbers", numbers);
  byId("group-check").textContent = revealed ? "答えをかくす" : "答え合わせ";
  byId("group-check").setAttribute("aria-expanded", String(revealed));
  byId("group-reveal").hidden = !revealed;
  if (!revealed) {
    byId("group-solution").innerHTML = "";
    return;
  }
  const [common, multiple] = expected(numbers);
  const item = workedProblem(numbers);
  byId("group-solution").innerHTML =
    '<div class="group-scores"><p class="group-score gcd">最大公約数<strong>' + common + '</strong></p>' +
    '<p class="group-score lcm">最小公倍数<strong>' + multiple + '</strong></p></div>' +
    '<div class="group-worked">' + workedContent(item) + '<div><h3 class="card-heading">すだれ算の手順</h3>' +
    workedSteps(item) + '</div></div>';
}

function divide(event) {
  event.preventDefault();
  const item = currentProblem();
  if (item.phase === "answer") return;
  const input = byId("divisor");
  const divisor = integer(input.value);
  const numbers = remaining(item);
  const multiple = item.phase === "multiple";
  let error = "";
  if (divisor === null || divisor < 2) {
    error = "2 以上の整数を入れよう。";
  } else if (multiple && leastFactor(divisor) !== divisor) {
    error = "ここでは、2、3、5 などの素数を入れよう。";
  } else {
    const divisible = numbers.filter(number => number % divisor === 0).length;
    const needed = multiple ? 2 : numbers.length;
    if (divisible < needed) {
      if (multiple) {
        error = divisor + " でわり切れる数は " + divisible + " つだよ。2つ以上をわり切れる数をさがそう。";
      } else if (mode === "practice") {
        const explanation = numbers.map(number => {
          const remainder = number % divisor;
          return number + (remainder ? " は あまり " + remainder : " は わり切れる");
        }).join("、");
        error = divisor + " でわると、" + explanation + " よ。";
      } else {
        error = divisor + " では、すべての数をわり切れないよ。";
      }
    }
  }
  if (error) {
    input.setAttribute("aria-invalid", "true");
    message("board-feedback", error, "bad");
    input.focus();
    input.select();
    return;
  }

  const after = addStep(item, divisor);
  item.hint = 0;
  item.divisorDraft = "";
  displayBoard();
  const carried = numbers.filter(number => number % divisor !== 0);
  const feedback = carried.length
    ? numberList(carried) + " はわり切れないので、そのまま下に書いたよ。"
    : "全部わり切れたよ。下に " + numberList(after) + " を書いたよ。";
  message("board-feedback", feedback, "good");
  byId("divisor").focus();
}

function finishLadder() {
  const item = currentProblem();
  const multiple = item.phase === "multiple";
  if (nextDivisor(item) !== null) {
    const feedback = multiple ? "まだ 2つ以上をわり切れる数があるよ。" : "まだ全部をわり切れる同じ数があるよ。";
    message("board-feedback", feedback, "bad");
    byId("divisor").focus();
    return;
  }
  item.phase = "answer";
  item.hint = 0;
  item.divisorDraft = "";
  displayBoard();
  message("board-feedback");
  byId("gcd-answer").focus();
}

function undo() {
  const item = currentProblem();
  if (item.phase !== "answer") item.steps.pop();
  item.phase = divisionPhase(remaining(item));
  item.hint = 0;
  item.divisorDraft = "";
  item.answerDraft = ["", ""];
  clearAnswers();
  displayBoard();
  message("board-feedback", "1つ前にもどしたよ。");
  byId("divisor").focus();
}

function displayHint() {
  const item = currentProblem();
  const button = byId("hint");
  const hint = item.hint;
  button.textContent = ["ヒントを見る", "もう1つ見る", "最後のヒントを見る", "ヒントをとじる"][hint];
  button.setAttribute("aria-expanded", String(hint > 0));
  byId("hint-text").textContent = "";
  if (hint === 0) return;

  let hints;
  if (item.phase === "answer") {
    const { common, extra, last } = factorGroups(item);
    hints = [
      (item.numbers.length === 2 ? "最大公約数は左の数をかけるよ。" : "最大公約数は、全部を同時にわった数だけをかけるよ。") + " 最小公倍数は、左の数すべてと一番下の数をかけるよ。",
      "最大公約数の式は " + (common.join(" × ") || "1") + " だよ。",
      "最小公倍数は " + [product([...common, ...extra]), ...last].join(" × ") + "。順番にかけてみよう。"
    ];
  } else if (item.phase === "multiple") {
    const numbers = remaining(item);
    const divisor = partialDivisor(numbers);
    hints = [
      "まずは偶数を数えよう。偶数が2つ以上あれば、2 でわって続けられるよ。",
      "2 でわれなければ、3、5、7 など、ほかの素数でわり切れる数が2つ以上あるか調べよう。",
      divisor === null
        ? "2つ以上をわり切れる素数はないよ。「2つ以上をわる数はもうない」を押そう。"
        : numberList(numbers.filter(number => number % divisor === 0)) + " は " + divisor + " でわり切れるよ。左のマスに " + divisor + " を入れてみよう。"
    ];
  } else {
    const numbers = remaining(item);
    const first = numbers[0];
    const divisor = commonDivisor(numbers);
    const factors = [];
    for (let candidate = 2; candidate <= first; candidate++) {
      if (first % candidate === 0) factors.push(candidate);
    }
    hints = [
      "小さい数から順に考えよう。たとえば、どの数も偶数なら 2 でわり切れるよ。",
      first + " をわり切れる 2 以上の数は " + (factors.length ? factors.join("、") + " だよ。この中に、残りの数も全部わり切れる数はあるかな？" : "ないよ。"),
      divisor === null
        ? "全部をわり切れる同じ数はないよ。「" + byId("finish").textContent + "」を押そう。"
        : divisor + " なら全部わり切れるよ。左のマスに " + divisor + " を入れてみよう。"
    ];
  }
  byId("hint-text").textContent = hints[hint - 1];
}

function parseAnswers() {
  return answerInputs.map(input => integer(input.value));
}

function checkAnswers(event) {
  event.preventDefault();
  const item = currentProblem();
  if (item.phase !== "answer") return;
  const answers = parseAnswers();
  const invalid = answers.findIndex(answer => answer === null || answer < 1);
  if (invalid !== -1) {
    answerMark(invalid, "1 以上の整数を入れよう。", "bad");
    message("answer-feedback", "2つの答えを数字で入れよう。", "bad");
    answerInputs[invalid].focus();
    return;
  }
  if (mode === "test") {
    recordTest(answers, false);
    return;
  }

  const correct = expected(item.numbers);
  const matches = answers.map((answer, index) => answer === correct[index]);
  matches.forEach((match, index) => {
    answerMark(index, match ? "○ 正解！" : "もう一度かけ算をたしかめよう。", match ? "good" : "bad");
  });
  const allCorrect = matches.every(Boolean);
  message("answer-feedback", allCorrect ? "どちらも正解！" : "式を見ながら、もう一度計算してみよう。", allCorrect ? "good" : "bad");
  if (allCorrect) {
    byId("next").focus({ preventScroll: true });
  } else {
    answerInputs[matches.indexOf(false)].focus();
  }
}

function recordTest(answers, skipped) {
  const test = session.test;
  if (test.index >= testLength || test.records[test.index]) return;
  const numbers = test.current.numbers;
  const correct = expected(numbers);
  const matches = answers.map((answer, index) => !skipped && answer === correct[index]);
  test.records.push({ numbers, answers, matches, skipped });
  showQuestion();
  byId("answer-title").focus();
}

function displayTestReview(record, last) {
  const correct = expected(record.numbers);
  record.matches.forEach((match, index) => {
    if (record.skipped) {
      answerMark(index, "正しい答えは " + correct[index] + "。");
    } else if (match) {
      answerMark(index, "○ 正解！", "good");
    } else {
      answerMark(index, "× 不正解。正しい答えは " + correct[index] + "。", "bad");
    }
  });
  const correctCount = record.matches.filter(Boolean).length;
  const feedback = ["2つとも不正解。正しい答えを確認しよう。", "1つ正解。まちがえた答えを確認しよう。", "どちらも正解！"];
  const text = record.skipped ? "正しい答えを確認しよう。" : feedback[correctCount];
  const kind = record.skipped ? "" : correctCount === 2 ? "good" : "bad";
  message("answer-feedback", text, kind);
  byId("test-next").textContent = last ? "テスト結果を見る" : "次の問題へ";
}

function nextTestQuestion() {
  const test = session.test;
  if (!test.records[test.index]) return;
  test.index++;
  if (test.index < testLength) test.current = problem(test.problems[test.index]);
  showQuestion(true);
}

function workedContent(item) {
  const { common, extra, last } = factorGroups(item);
  const [greatest, least] = expected(item.numbers);
  const commonText = common.length > 1 ? common.join(" × ") + " ＝ " + greatest : String(greatest);
  const multipleText = [...(common.length ? common : [1]), ...extra, ...last].join(" × ") + " ＝ " + least;
  return '<div class="worked"><div class="board">' + ladder(item) + boardKey(item) + '</div>' +
    (extra.length ? '<p>「↓」の数はわり切れないので、そのまま下におろすよ。</p>' : "") +
    '<p class="gcd-text">最大公約数 <strong>' + commonText + '</strong></p>' +
    '<p class="lcm-text">最小公倍数 <strong>' + multipleText + '</strong></p></div>';
}

function workedSteps(item) {
  const steps = item.steps.map(step => {
    if (step.phase === "common") {
      return numberList(step.before) + " を " + step.divisor + " でわると、" + numberList(step.after) + "。";
    }
    const divided = step.before.filter(number => number % step.divisor === 0);
    const carried = step.before.filter(number => number % step.divisor !== 0);
    return numberList(divided) + " を " + step.divisor + " でわる。" + numberList(carried) + " はそのまま下へ。下の段は " + numberList(step.after) + "。";
  });
  const bottom = item.steps.length ? "最後に残った数" : "はじめの数";
  steps.push(bottom + "のうち、2つ以上を同時にわり切れる数がなくなったら、ここまで。");
  const left = item.numbers.length === 2 ? "左の数" : "全部を同時にわった数";
  const hasCommon = item.steps.some(step => step.phase === "common");
  steps.push(hasCommon ? "最大公約数は、" + left + "をかける。" : "全部を同時にわる数がないので、最大公約数は 1。");
  steps.push("最小公倍数は、左の数すべてと一番下の数をかける。");
  return '<ol class="worked-steps">' + steps.map(step => '<li>' + step + '</li>').join("") + '</ol>';
}

function displayResults(moveFocus) {
  const test = session.test;
  const score = test.records.reduce((total, record) => total + record.matches.filter(Boolean).length, 0);
  const complete = test.records.filter(record => record.matches.every(Boolean)).length;
  const details = test.records.map((record, index) => {
    const feedback = record.answers.map((value, answerIndex) =>
      value + (record.matches[answerIndex] ? "（正解）" : "（見直そう）")
    );
    const submitted = record.skipped
      ? "この問題はとばしたよ。"
      : "入力した答え　最大公約数 " + feedback[0] + " ／ 最小公倍数 " + feedback[1];
    const count = record.matches.filter(Boolean).length;
    return '<details><summary>第 ' + (index + 1) + ' 問<span>' + numberList(record.numbers) + '</span>' +
      '<span class="summary-mark">' + (record.skipped ? "とばした" : count + " / 2 正解") + '</span></summary>' +
      '<p class="answer-help">' + submitted + '</p>' + workedContent(workedProblem(record.numbers)) + '</details>';
  }).join("");
  byId("results").innerHTML = '<div class="result-head"><h2 class="result-title" id="result-title" tabindex="-1">テストの結果</h2>' +
    '<button class="button primary" id="retry-test" type="button">もう一度テストする</button></div>' +
    '<p class="score"><strong>' + score + '</strong> / ' + (testLength * 2) + ' 正解</p>' +
    '<p class="answer-help">' + complete + ' 問で、最大公約数と最小公倍数の両方が正解。問題を開くと解き方を見られるよ。</p>' +
    '<div class="result-list">' + details + '</div>';
  byId("retry-test").addEventListener("click", () => {
    startTest();
    showQuestion(true);
  });
  if (moveFocus) byId("result-title").focus();
}

function showWorked(isExample) {
  const current = currentProblem();
  const numbers = isExample ? examples[session.count] : current.numbers;
  const item = !isExample && current.phase === "answer" ? current : workedProblem(numbers);
  byId("dialog-title").textContent = isExample ? "すだれ算のお手本" : "解き方と答え";
  let steps;
  if (numbers.length === 2) {
    steps = isExample
      ? '<ol class="dialog-steps"><li>12 と 18 を 2 でわると、6 と 9。</li><li>6 と 9 を 3 でわると、2 と 3。</li><li>2 と 3 は、2 以上の同じ数ではわり切れないので、ここまで。</li></ol>'
      : '<p class="dialog-lead">2つともわり切れる数を左に書いて、わった答えを下に書くよ。</p>';
  } else {
    steps = '<ol class="dialog-steps"><li>全部をわり切れる数でわって、最大公約数に使う数を見つけるよ。</li>' +
      '<li>次に、2つ以上をわり切れる素数でわるよ。これ以上わる数がなければ、すだれ算のできあがり。</li></ol>';
  }
  byId("dialog-content").innerHTML = steps + workedContent(item);
  byId("worked-dialog").showModal();
}

byId("divide-form").addEventListener("submit", divide);
byId("finish").addEventListener("click", finishLadder);
byId("undo").addEventListener("click", undo);
byId("answer-form").addEventListener("submit", checkAnswers);
byId("next").addEventListener("click", nextPractice);
byId("test-next").addEventListener("click", nextTestQuestion);
byId("skip").addEventListener("click", () => recordTest([null, null], true));
byId("level").addEventListener("change", loadSettings);
byId("difficulty").addEventListener("change", loadSettings);
answerInputs.forEach((input, index) => {
  input.addEventListener("input", () => {
    currentProblem().answerDraft[index] = input.value;
    answerMark(index);
    message("answer-feedback");
  });
});
byId("board").addEventListener("input", event => {
  if (event.target.id === "divisor") {
    currentProblem().divisorDraft = event.target.value;
    event.target.removeAttribute("aria-invalid");
    if (byId("board-feedback").dataset.kind === "bad") message("board-feedback");
  }
});
byId("practice-mode").addEventListener("click", () => {
  if (mode === "practice") return;
  mode = "practice";
  showQuestion(false);
});
byId("test-mode").addEventListener("click", () => {
  if (mode === "test") return;
  mode = "test";
  showQuestion(false);
});
byId("solo-mode").addEventListener("click", () => {
  if (audience === "solo") return;
  audience = "solo";
  showQuestion();
});
byId("group-mode").addEventListener("click", () => {
  if (audience === "group") return;
  audience = "group";
  showQuestion();
});
byId("group-next").addEventListener("click", () => nextGroup(true));
byId("group-check").addEventListener("click", () => {
  const group = session.group;
  group.revealed = !group.revealed;
  displayGroup();
  if (group.revealed) byId("group-reveal-title").focus();
});
byId("hint").addEventListener("click", () => {
  const item = currentProblem();
  item.hint = (item.hint + 1) % 4;
  displayHint();
});
byId("example").addEventListener("click", () => showWorked(true));
byId("solution").addEventListener("click", () => showWorked(false));

loadSettings();
</script>
</body>
</html>
